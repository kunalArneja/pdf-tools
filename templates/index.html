<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Tools - Add Text Box</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>PDF Tools</h1>
        </header>

        <main>
            <form id="pdf-form" enctype="multipart/form-data" method="POST" action="/process">
                <div class="upload-section">
                    <label for="pdf-upload" class="upload-label">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <span>Click to upload PDF</span>
                        <input type="file" id="pdf-upload" name="file" accept=".pdf" hidden required>
                    </label>
                    <div id="file-name" class="file-name"></div>
                </div>

                <div class="text-input-section" id="text-input-section" style="display: none;">
                    <label for="text-box">Enter text for the top section:</label>
                    <textarea id="text-box" name="text" placeholder="Enter your text here..."></textarea>
                    
                    <div class="formatting-controls">
                        <div class="control-group">
                            <label for="font-size">Font Size:</label>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <input type="number" id="font-size" name="font_size" min="8" max="72" value="16" step="1" style="flex: 1;">
                                <span class="control-unit">pt</span>
                            </div>
                        </div>
                        
                        <div class="control-group">
                            <label for="font-family">Font:</label>
                            <select id="font-family" name="font_family">
                                <option value="Helvetica">Helvetica</option>
                                <option value="Times-Roman">Times Roman</option>
                                <option value="Courier">Courier</option>
                            </select>
                        </div>
                        
                        <div class="control-group">
                            <label for="text-color">Text Color:</label>
                            <input type="color" id="text-color" name="text_color" value="#000000">
                        </div>
                        
                        <div class="control-group">
                            <label for="bg-color">Background Color:</label>
                            <input type="color" id="bg-color" name="bg_color" value="#FAFAFA">
                        </div>
                    </div>
                    
                    <div class="buttons">
                        <button type="submit" id="process-btn" class="btn btn-primary">Process PDF</button>
                        <button type="button" id="reset-btn" class="btn btn-secondary">Reset</button>
                    </div>
                </div>

                <div id="error-message" class="error-message"></div>
            </form>
        </main>
    </div>

    <script>
        // File upload handler
        document.getElementById('pdf-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('file-name').textContent = `Selected: ${file.name}`;
                document.getElementById('text-input-section').style.display = 'block';
                document.getElementById('error-message').classList.remove('show');
            }
        });

        // Form submission handler
        document.getElementById('pdf-form').addEventListener('submit', function(e) {
            const fileInput = document.getElementById('pdf-upload');
            if (!fileInput.files || !fileInput.files[0]) {
                e.preventDefault();
                showError('Please upload a PDF file first');
                return false;
            }
            
            const processBtn = document.getElementById('process-btn');
            processBtn.textContent = 'Processing...';
            processBtn.disabled = true;
            
            // Reset button after form submission completes (for successful downloads)
            // The form will navigate away, so this is mainly for error cases
            setTimeout(function() {
                processBtn.textContent = 'Process PDF';
                processBtn.disabled = false;
            }, 5000);
        });

        // Reset button handler
        document.getElementById('reset-btn').addEventListener('click', function() {
            document.getElementById('pdf-form').reset();
            document.getElementById('file-name').textContent = '';
            document.getElementById('text-input-section').style.display = 'none';
            document.getElementById('error-message').classList.remove('show');
        });

        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }

        // Check for error in URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error')) {
            showError(decodeURIComponent(urlParams.get('error')));
        }
    </script>
</body>
</html>
